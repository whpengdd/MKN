[package]
name = "app"
version = "0.0.0"
description = "隐墨 / Inkveil — 本地无缝 Markdown 编辑器"
authors = ["Inkveil"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# 单文件外部改动监听(对齐 electron/main.ts 的 fs.watch + 自写过滤 + 去抖)
notify = "6"
# .docx 有损导入(仅查看):解析为 markdown 子集,丢弃样式。
docx-rs = "0.4"

# Task 2.10 PDF 导出(方案 A:离屏 WKWebView createPDF)。版本严格对齐
# wry 0.55.1 所锁(否则 PlatformWebview 指针所指对象与这些 binding 的
# WKWebView 类型不一致)。仅 macOS 编译;其余平台 export_pdf 走 cfg 占位。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSError"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKPDFConfiguration", "block2"] }
block2 = "0.6"
